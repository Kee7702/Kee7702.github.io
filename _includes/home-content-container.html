<div class="home-content-container{% if include.context.inline %} images{% endif %}">{% for item in include.context.items %}<a {% if item.disabled %}disabled=""{% elsif item.link %}href="{{ item.link }}"{% endif %}class="home-content-item"{% if item.image %}style="--card-image:url('{{ item.image }}')"{% endif %}>{% if item.name %}<div><p{% if item.icon %} class="icon"style="{% if item.icon.image %}--image:url('{{ item.icon.image }}'){% elsif item.icon.icon %}--icon:'{{ item.icon.icon }}'{% endif %}"{% endif %}>{{ item.name }}</p></div>{% endif %}</a>{% endfor %}</div>
