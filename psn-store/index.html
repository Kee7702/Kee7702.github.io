---
layout: default
---
<div hidden="" id="keeterial-psnstoreIcons">
  <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <symbol id="keeterial-search" viewBox="2 2 20 20"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></symbol>
  </svg>
</div>
<form style="display:flex;margin:-10px -10px 10px;background:var(--background-tertiary);border-top:2px solid rgba(255,255,255,.08)"><img loading="lazy"src="https://store.playstation.com/img/store-logo.svg"style="height:32px;padding:7px"><input type="text"required=""name="q"placeholder="Search Query"style="margin:0;padding:15px;background:none;border-radius:0;border-left:2px solid rgba(255,255,255,.08)"><button type="submit"style="margin:0;padding:11px;background:none"><svg xmlns="http://www.w3.org/2000/svg"height="24"width="24"><use xlink:href="#keeterial-search"></use></svg></button></form><script>Array.from(document.getElementsByTagName('form')[0].elements).filter(a=>a.type!='submit').map(a=>{if(new URLSearchParams(window.location.search).get(a.name)){a.value=new URLSearchParams(window.location.search).get(a.name)}});if(new URLSearchParams(window.location.search).get('q')!=null){document.getElementById('sAPIcontainer').innerHTML+='<div id="loading-content"style="text-align:center"><img src="/psn-store/psn-store_1.gif"></div>';(async()=>{try{storecheck=await (await fetch("https://store.playstation.com/store/api/chihiro/00_09_000/tumbler/US/en/99/"+(new URLSearchParams(window.location.search).get('q')||'')+"?size="+(new URLSearchParams(window.location.search).get('s')||'50')+"&platform="+(new URLSearchParams(window.location.search).get('p')||'psp,ps3,vita,ps4,ps5')+"&start="+(parseInt(new URLSearchParams(window.location.search).get('o')||'0')*parseInt(new URLSearchParams(window.location.search).get('s')||'50')))).json();document.getElementById('sAPIcontainer').innerHTML+=storecheck.links.map(a=>`<div style="margin-top:8px"><img loading="lazy"src="https://store.playstation.com/store/api/chihiro/00_09_000/container/US/en/99/${a.id}/image?h=64"onerror="this.src='https://store.playstation.com/img/default/product-image-game.svg'"style="width:64px;height:64px;border-radius:6px"><a style="vertical-align:middle;font-size:16px;font-weight:bold;alignment-baseline:middle;line-height:16px;position:absolute;margin-left:8px;margin-top:12px;text-decoration:none;overflow:hidden"href="psns:browse?product=${a.id}">${a.name}</a><a style="vertical-align:middle;font-size:12px;font-weight:bold;alignment-baseline:middle;line-height:12px;position:absolute;margin-left:6px;margin-top:36px"><div style="background:var(--background-secondary);padding:4px;margin:2px;display:inline;border-radius:4px">${a.default_sku&&a.default_sku.display_price||'Unavailable'}</div><div style="background:var(--background-tertiary);padding:4px;margin:2px;display:inline;border-radius:4px">${a.playable_platform.join('</div><div style="background:var(--background-tertiary);padding:4px;margin:2px;display:inline;border-radius:4px">')}</div></a></div>`).join('')+'<div class="storage-nav"style="text-align:center"><p>Page '+(parseInt(new URLSearchParams(window.location.search).get('o'))>0&&(parseInt(new URLSearchParams(window.location.search).get('o'))+1)||'1')+' of '+(Math.ceil(storecheck.total_results/(parseInt(new URLSearchParams(window.location.search).get('s'))||'50')))+'</p><div class="common-nav-container">'+((parseInt(new URLSearchParams(window.location.search).get('o'))>0)&&('<a href="?q='+new URLSearchParams(window.location.search).get('q')+'&p='+(new URLSearchParams(window.location.search).get('p')||'psp,ps3,vita,ps4,ps5')+'&o='+(new URLSearchParams(window.location.search).get('o')-1)+'"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="2 2 20 20"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"></path></svg></a>')||(''))+((parseInt(new URLSearchParams(window.location.search).get('o')||'0')<(Math.ceil(storecheck.total_results/(parseInt(new URLSearchParams(window.location.search).get('s'))||'50'))-1)&&('<a href="?q='+new URLSearchParams(window.location.search).get('q')+'&p='+(new URLSearchParams(window.location.search).get('p')||'psp,ps3,vita,ps4,ps5')+'&o='+(parseInt(new URLSearchParams(window.location.search).get('o')||'0')+1)+'"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="2 2 20 20"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"></path></svg></a>')||('')))+'</div></div>';Array.from(document.getElementsByTagName('form')[0].elements).filter(a=>a.type!='submit').map(a=>{if(new URLSearchParams(window.location.search).get(a.name)){a.value=new URLSearchParams(window.location.search).get(a.name)}});document.getElementById('loading-content').remove()}catch{document.getElementById('loading-content').remove();document.getElementById('sAPIcontainer').innerHTML+='<div id="loading-content" style="text-align:center"><a>Unable to access PlayStation Store</a></div>'}})()}</script>
